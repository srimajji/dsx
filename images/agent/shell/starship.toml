# Fast, color-neutral prompt defaults for DSX managed containers.
add_newline = false
scan_timeout = 10
command_timeout = 200
follow_symlinks = false
format = "$env_var$directory$git_branch$git_status$nodejs$python$golang$java$cmd_duration$status$jobs$character"

[env_var.DSX_SANDBOX]
format = "sandbox:$env_value "

[directory]
format = "$path$read_only "
truncation_length = 4
truncate_to_repo = true
read_only = " ro"

[git_branch]
format = "git:$branch "
truncation_length = 32
only_attached = false

[git_status]
format = "($all_status$ahead_behind )"
conflicted = "!"
ahead = ">${count}"
behind = "<${count}"
diverged = "<>${ahead_count}/${behind_count}"
untracked = "?"
stashed = "$"
modified = "~"
staged = "+"
renamed = "r"
deleted = "x"

[nodejs]
format = "node $version "
detect_extensions = ["js", "mjs", "cjs", "ts", "mts", "cts"]
detect_files = ["package.json", ".node-version"]
detect_folders = []

[python]
format = "python $version$virtualenv "
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile", "tox.ini", "setup.py"]
detect_folders = []

[golang]
format = "go $version "
detect_extensions = ["go"]
detect_files = ["go.mod", "go.sum", "go.work", "glide.yaml", "Gopkg.yml", "Gopkg.lock"]
detect_folders = ["Godeps"]

[java]
format = "java $version "
detect_extensions = ["java", "class", "gradle", "jar"]
detect_files = ["pom.xml", "build.gradle.kts", "build.sbt", ".java-version", "deps.edn", "project.clj", "build.boot"]
detect_folders = []

[cmd_duration]
format = "took $duration "
min_time = 2000
show_milliseconds = false

[status]
disabled = false
format = "exit $status "

[jobs]
format = "jobs:$number "
number_threshold = 1
symbol_threshold = 1

[character]
success_symbol = "> "
error_symbol = "> "
vimcmd_symbol = "< "
vimcmd_replace_one_symbol = "< "
vimcmd_replace_symbol = "< "
vimcmd_visual_symbol = "< "
