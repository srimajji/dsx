name: release-candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: dsx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-notarized-candidate:
    if: github.repository == 'srimajji/dsx' && github.ref_type == 'tag'
    environment: release
    runs-on: [self-hosted, dsx-release, macOS, ARM64]
    timeout-minutes: 60
    env:
      DSX_AGENT_IMAGE: ${{ vars.DSX_AGENT_IMAGE }}
      DSX_BROWSER_IMAGE: ${{ vars.DSX_BROWSER_IMAGE }}
      SIGNING_IDENTITY: ${{ secrets.DSX_SIGNING_IDENTITY }}
      NOTARY_KEYCHAIN_PROFILE: ${{ secrets.DSX_NOTARY_KEYCHAIN_PROFILE }}
    steps:
      - name: Check out trusted tag commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select pinned Go toolchain
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: true

      - name: Preflight trusted release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo 'release requires a trusted version tag' >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo 'release tag is not SemVer' >&2; exit 1;
          }
          [[ -n "$DSX_AGENT_IMAGE" ]] || { echo 'BLOCKED: published agent image digest is not configured' >&2; exit 1; }
          [[ -n "$DSX_BROWSER_IMAGE" ]] || { echo 'BLOCKED: published browser image digest is not configured' >&2; exit 1; }
          [[ -n "$SIGNING_IDENTITY" ]] || { echo 'BLOCKED: Developer ID Application identity is not configured' >&2; exit 1; }
          [[ -n "$NOTARY_KEYCHAIN_PROFILE" ]] || { echo 'BLOCKED: notarization keychain profile is not configured' >&2; exit 1; }
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'COMMIT=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          printf 'OUT_DIR=%s\n' "$RUNNER_TEMP/dsx-${version}-dry-run" >> "$GITHUB_ENV"
          printf 'SIGNED_OUT=%s\n' "$RUNNER_TEMP/dsx-${version}-signed" >> "$GITHUB_ENV"

      - name: Install digest-pinned SBOM tool
        shell: bash
        run: ./scripts/release/install-syft.sh

      - name: Build deterministic unsigned candidate
        shell: bash
        run: ./scripts/release/build.sh

      - name: Sign, notarize, and verify candidate
        shell: bash
        run: ./scripts/release/sign-notarize.sh "$OUT_DIR"

      - name: Clean-prefix smoke and read-only doctor
        shell: bash
        run: ./scripts/release/smoke-install.sh "$SIGNED_OUT/package" "$SIGNED_OUT/notarization.json"

      - name: Record non-publication gate
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SIGNED_OUT/checksums.txt"
          echo 'Candidate retained only in the trusted runner workspace; this workflow does not publish.'
